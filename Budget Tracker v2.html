   BUDGET TRACKER v2 — CATPPUCCIN AMOLED BLACK BLOCKY STYLES

:root {
  --bg: #000000;          /* True AMOLED pure pitch-black */

  --card-alt: #181825;    /* Catppuccin Mantle */

  --line: #313244;        /* Catppuccin Surface0 */
  --line-high: #45475a;   /* Catppuccin Surface1 */
  --line-strong: #585b70; /* Catppuccin Surface2 */
  
  --acc: #a6e3a1;         /* Catppuccin Green */
  --accfg: #000000;
  --sapphire: #74c7ec;    /* Sapphire blue */
  --mauve: #cba6f7;       /* Mauve */
  --peach: #fab387;       /* Peach / Warn */
  --bad: #f38ba8;         /* Red / Alert */
  --teal: #94e2d5;
  --yellow: #f9e2af;

  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;

  color-scheme: dark;
}

/* ZERO ROUND CORNERS EVERYWHERE - STRICTLY BLOCKY */
*, *::before, *::after {
  box-sizing: border-box;
  border-radius: 0 !important;
}

  margin: 0;

  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

.mono {

  font-variant-numeric: tabular-nums;
}

<script>
(() => {

// --- src/domain/dateUtils.mjs ---
/**
 * Pure date utility functions using local ISO strings (YYYY-MM-DD)
 * and day arithmetic via UTC day numbers.
 */

const pad2 = (n) => String(n).padStart(2, '0');

const formatDate = (d) =>
  `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;

const todayISO = () => formatDate(new Date());

const parseISO = (s) => {
  if (!s || typeof s !== 'string') return new Date();
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d || 1);
};

/**
 * Returns UTC day number for YYYY-MM-DD
 */
const dayNumber = (s) => {
  if (!s) return 0;
  const [y, m, d] = s.split('-').map(Number);
  return Math.floor(Date.UTC(y, m - 1, d || 1) / 864e5);
};

const dayDiff = (startStr, endStr) => {
  return dayNumber(endStr) - dayNumber(startStr);
};

const addDays = (s, k) => {
  const [y, m, d] = s.split('-').map(Number);
  const next = new Date(y, m - 1, (d || 1) + k);
  return formatDate(next);
};

const addMonths = (s, mCount) => {
  const [y, m, d] = s.split('-').map(Number);
  // Target month and year
  const targetMonthIndex = (m - 1) + mCount;
  const next = new Date(y, targetMonthIndex, d || 1);
  return formatDate(next);
};

const shortDate = (s) => {
  if (!s) return '';
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d || 1).toLocaleDateString('en-IN', {
    day: 'numeric',
    month: 'short'
  });
};

const formatINR = (n) => {
  const r = Math.round((Number(n) || 0) * 100) / 100;
  const isNeg = r < 0;
  const abs = Math.abs(r);
  return (isNeg ? '−₹' : '₹') + abs.toLocaleString('en-IN', {
    minimumFractionDigits: 0,
    maximumFractionDigits: 2
  });
};

const getMonthShard = (dateStr) => {
  const s = dateStr || todayISO();
  return s.slice(0, 7); // YYYY-MM
};

const getCycleEnd = (todayStr, cycleDay = 1) => {
  const [y, m, d] = (todayStr || todayISO()).split('-').map(Number);
  let nextCycleDate;
  if (d < cycleDay) {
    nextCycleDate = new Date(y, m - 1, cycleDay);
  } else {
    nextCycleDate = new Date(y, m, cycleDay);
  }
  return formatDate(nextCycleDate);
};

// --- src/domain/types.mjs ---
/**
 * Core type definitions, constants, and default seeds for Budget Tracker v2
 */

const DEFAULT_POOLS = [
  { id: 'pool-bank', name: 'Bank Account', type: 'bank', opening: 0, isArchived: false },
  { id: 'pool-cash', name: 'Cash in Hand', type: 'cash', opening: 0, isArchived: false },
  { id: 'pool-upi', name: 'UPI / Wallet', type: 'upi', opening: 0, isArchived: false }
];

const DEFAULT_ENVELOPES = [
  { id: 'env-impulse', name: 'Impulse', kind: 'envelope', funding: [], refillMonthly: false, refillAmount: 0, hardCap: true },
  { id: 'env-petrol', name: 'Petrol', kind: 'envelope', funding: [], refillMonthly: true, refillAmount: 2000, hardCap: false },
  { id: 'env-utilities', name: 'Utilities', kind: 'envelope', funding: [], refillMonthly: false, refillAmount: 0, hardCap: false },
  { id: 'env-rent', name: 'Rent', kind: 'envelope', funding: [], refillMonthly: true, refillAmount: 15000, hardCap: false },
  { id: 'env-misc', name: 'Misc', kind: 'envelope', funding: [], refillMonthly: false, refillAmount: 0, hardCap: false }
];

const createInitialConfig = () => ({
  version: 2,
  cycleStartDay: 1,
  activeTab: 'overview',
  activeBudgetId: null,
  pools: [...DEFAULT_POOLS],
  budgets: [
    {
      id: 'budget-daily',
      name: 'Daily Spending',
      kind: 'daily',
      amount: 6000,
      days: 30,
      start: '2026-11-01',
      funding: [{ poolId: 'pool-bank', amount: 6000 }]
    },
    ...DEFAULT_ENVELOPES
  ],
  obligations: [],
  expectedIncomes: [],
  v1Migration: null
});

// --- src/domain/recurrence.mjs ---


/**
 * Computes all occurrence dates of a recurring rule between fromDate and targetDate inclusive.
 * Handles interval in months, weeks, or days.
 *
 * @param {Object} rule
 * @param {number} rule.interval - e.g. 1 (monthly), 2 (every 2 months for electricity)
 * @param {'months'|'weeks'|'days'} rule.unit
 * @param {string} rule.anchorDate - Base starting date 'YYYY-MM-DD'
 * @param {string} targetDate - End of horizon 'YYYY-MM-DD'
 * @param {string|null} fromDate - Earliest date to include (inclusive, default null = all >= anchorDate)
 * @returns {string[]} Array of ISO dates
 */
function getOccurrencesUpTo(rule, targetDate, fromDate = null) {
  if (!rule || !rule.anchorDate || !targetDate) return [];
  const interval = Math.max(1, Math.floor(Number(rule.interval) || 1));
  const unit = rule.unit || 'months';

  const anchor = parseISO(rule.anchorDate);
  const targetDayNum = dayNumber(targetDate);
  const fromDayNum = fromDate ? dayNumber(fromDate) : null;

  const occurrences = [];
  let curr = new Date(anchor.getFullYear(), anchor.getMonth(), anchor.getDate());
  let iteration = 0;
  const maxIterations = 240; // Guard against runaway loops (e.g. 20 years)

  while (iteration++ < maxIterations) {
    const currStr = formatDate(curr);
    const currDayNum = dayNumber(currStr);

    if (currDayNum > targetDayNum) {
      break;
    }

    if (fromDayNum === null || currDayNum >= fromDayNum) {
      occurrences.push(currStr);
    }

    // Step forward
    if (unit === 'months') {
      const nextMonth = curr.getMonth() + interval;
      const originalDay = anchor.getDate();
      // Handle month end clipping (e.g. 31st to 30th/28th)
      const testDate = new Date(curr.getFullYear(), nextMonth, 1);
      const daysInNextMonth = new Date(testDate.getFullYear(), testDate.getMonth() + 1, 0).getDate();
      curr = new Date(testDate.getFullYear(), testDate.getMonth(), Math.min(originalDay, daysInNextMonth));
    } else if (unit === 'weeks') {
      curr = parseISO(addDays(currStr, interval * 7));
    } else if (unit === 'days') {
      curr = parseISO(addDays(currStr, interval));
    } else {
      break;
    }
  }

  return occurrences;
}

/**
 * Returns the next upcoming occurrence strictly >= afterDate
 */
function getNextOccurrence(rule, afterDate) {
  if (!rule || !rule.anchorDate) return null;
  const afterDayNum = dayNumber(afterDate);
  const interval = Math.max(1, Math.floor(Number(rule.interval) || 1));
  const unit = rule.unit || 'months';

  let curr = parseISO(rule.anchorDate);
  let iteration = 0;
  while (iteration++ < 240) {
    const currStr = formatDate(curr);
    if (dayNumber(currStr) >= afterDayNum) {
      return currStr;
    }
    if (unit === 'months') {
      const nextMonth = curr.getMonth() + interval;
      curr = new Date(curr.getFullYear(), nextMonth, curr.getDate());
    } else if (unit === 'weeks') {
      curr = parseISO(addDays(currStr, interval * 7));
    } else {
      curr = parseISO(addDays(currStr, interval));
    }
  }
  return null;
}

// --- src/domain/ledger.mjs ---
/**
 * Pure ledger calculation engine.
 * Derives pool balances, budget spends, and obligation settlements directly from append-only events.
 */

/**
 * Calculates current balance for all pools based on opening balances + ledger events.
 *
 * balance = opening + Σ income + Σ loan_in − Σ spend − Σ repayment_out − Σ loan_out ± Σ transfer ± Σ adjustment
 *
 * @param {Array} pools
 * @param {Array} ledgerEntries
 * @returns {Map<string, { id: string, name: string, type: string, balance: number, opening: number, isArchived: boolean }>}
 */
function calculatePoolBalances(pools, ledgerEntries = []) {
  const map = new Map();
  for (const p of pools) {
    map.set(p.id, {
      id: p.id,
      name: p.name,
      type: p.type || 'bank',
      opening: Number(p.opening) || 0,
      balance: Number(p.opening) || 0,
      isArchived: Boolean(p.isArchived)
    });
  }

  // Sort entries chronologically to ensure adjustments set state accurately in time order
  const sorted = [...ledgerEntries].sort((a, b) => {
    if (a.date !== b.date) return a.date.localeCompare(b.date);
    return (a.id || '').localeCompare(b.id || '');
  });

  for (const entry of sorted) {
    const amt = Number(entry.amount) || 0;
    const pool = map.get(entry.poolId);

    switch (entry.type) {
      case 'income':
      case 'loan_in': {
        if (pool) pool.balance += amt;
        break;
      }

      case 'expense':
      case 'loan_out': {
        if (pool) pool.balance -= amt;
        break;
      }

      case 'transfer': {
        const fromPool = map.get(entry.poolId);
        const toPool = map.get(entry.toPoolId);
        if (fromPool) fromPool.balance -= amt;
        if (toPool) toPool.balance += amt;
        break;
      }

      case 'repayment': {
        if (pool) {
          // If direction === 'in' (someone repaid me), money enters pool
          // If direction === 'out' (I repaid debt), money leaves pool
          if (entry.direction === 'in') {
            pool.balance += amt;
          } else {
            pool.balance -= amt;
          }
        }
        break;
      }

      case 'adjustment': {
        if (pool) {
          if (typeof entry.targetBalance === 'number') {
            pool.balance = entry.targetBalance;
          } else if (typeof entry.delta === 'number') {
            pool.balance += entry.delta;
          }
        }
        break;
      }

      case 'allocation':
        // Allocation adjusts budget earmarks, no physical pool balance change
        break;

      default:
        break;
    }
  }

  return map;
}

/**
 * Returns map of budgetId -> total spend
 */
function aggregateBudgetSpends(ledgerEntries = []) {
  const spendMap = new Map();
  for (const entry of ledgerEntries) {
    if (entry.type === 'expense' && entry.budgetId) {
      const prev = spendMap.get(entry.budgetId) || 0;
      spendMap.set(entry.budgetId, prev + (Number(entry.amount) || 0));
    }
  }
  return spendMap;
}

/**
 * Returns map of obligationId -> total repayments & expenses
 */
function aggregateObligationPayments(ledgerEntries = []) {
  const map = new Map();
  for (const entry of ledgerEntries) {
    const amt = Number(entry.amount) || 0;
    if (entry.type === 'repayment' && entry.obligationId) {
      const prev = map.get(entry.obligationId) || 0;
      map.set(entry.obligationId, prev + amt);
    } else if (entry.type === 'expense' && entry.obligationId) {
      // Bill payment entered as expense charged to obligation
      const prev = map.get(entry.obligationId) || 0;
      map.set(entry.obligationId, prev + amt);
    }
  }
  return map;
}

/**
 * Computes net funding allocated to a budget from allocations
 */
function aggregateAllocations(ledgerEntries = []) {
  const budgetAllocations = new Map();
  for (const entry of ledgerEntries) {
    if (entry.type === 'allocation') {
      const amt = Number(entry.amount) || 0;
      if (entry.toBudgetId) {
        const cur = budgetAllocations.get(entry.toBudgetId) || 0;
        budgetAllocations.set(entry.toBudgetId, cur + amt);
      }
      if (entry.fromBudgetId) {
        const cur = budgetAllocations.get(entry.fromBudgetId) || 0;
        budgetAllocations.set(entry.fromBudgetId, cur - amt);
      }
    }
  }
  return budgetAllocations;
}

// --- src/domain/budgets.mjs ---



/**
 * Calculates rolling daily allowance for a 'daily' budget.
 * Exact v1 parity:
 * allowance_i = (B − spent_before_i) / (N − i)
 * left_i = allowance_i − spent_i
 *
 * @param {Object} b - Daily budget object
 * @param {Array} ledgerEntries - All ledger entries
 * @param {string} asOfDate - Target date (defaults to todayISO())
 */
function calcDailyBudget(b, ledgerEntries = [], asOfDate = todayISO()) {
  const N = Math.max(1, Math.floor(Number(b.days) || 30));
  const B = Number(b.amount) || 0;
  const s0 = dayNumber(b.start);
  const currentDayNum = dayNumber(asOfDate);
  const idx = currentDayNum - s0;

  const state = idx < 0 ? 'pre' : idx >= N ? 'done' : 'on';
  const di = Math.min(Math.max(idx, 0), N - 1);

  // Filter expenses belonging to this budget
  const expenses = ledgerEntries.filter(
    (e) => e.type === 'expense' && e.budgetId === b.id
  );

  const sp = Array(N).fill(0);
  for (const e of expenses) {
    const dayOffset = dayNumber(e.date) - s0;
    const clampedIndex = Math.min(Math.max(dayOffset, 0), N - 1);
    sp[clampedIndex] += Number(e.amount) || 0;
  }

  let cum = 0;
  const rows = [];
  for (let i = 0; i < N; i++) {
    const al = (B - cum) / (N - i);
    rows.push({
      i,
      date: addDays(b.start, i),
      al,
      sp: sp[i],
      left: al - sp[i]
    });
    cum += sp[i];
  }

  const currentRow = rows[di] || { al: B / N, sp: 0, left: B / N };
  const tomorrowRow = (state !== 'done' && di < N - 1) ? rows[di + 1] : null;
  const daysLeft = state === 'pre' ? N : state === 'done' ? 0 : N - di;

  return {
    N,
    B,
    state,
    di,
    rows,
    spent: cum,
    left: B - cum,
    currentAllowance: currentRow.al,
    spentToday: currentRow.sp,
    leftToday: state === 'done' ? B - cum : currentRow.left,
    tomorrowAllowance: tomorrowRow ? tomorrowRow.al : null,
    daysLeft,
    basePerDay: B / N,
    burnRateDaily: di > 0 ? cum / di : currentRow.sp
  };
}

/**
 * Computes envelope state: funded, spent, left, and hard cap status
 */
function calcEnvelope(envelope, ledgerEntries = []) {
  const staticFunding = (envelope.funding || []).reduce(
    (sum, f) => sum + (Number(f.amount) || 0),
    0
  );
  const ledgerAlloc = aggregateAllocations(ledgerEntries).get(envelope.id) || 0;
  const totalFunded = staticFunding + ledgerAlloc;

  const spendMap = aggregateBudgetSpends(ledgerEntries);
  const spent = spendMap.get(envelope.id) || 0;

  const left = totalFunded - spent;
  const fundedRemaining = Math.max(0, left);
  const isOverspent = left < 0;
  const pctSpent = totalFunded > 0 ? Math.min(100, Math.round((spent / totalFunded) * 100)) : (spent > 0 ? 100 : 0);

  return {
    id: envelope.id,
    name: envelope.name,
    kind: 'envelope',
    funded: totalFunded,
    spent,
    left,
    fundedRemaining,
    isOverspent,
    pctSpent,
    hardCap: Boolean(envelope.hardCap),
    refillMonthly: Boolean(envelope.refillMonthly),
    refillAmount: Number(envelope.refillAmount) || 0
  };
}

/**
 * Validates whether an expense can be added to a budget.
 * Blocks addition only if envelope has hardCap = true and expense exceeds remaining balance.
 */
function validateExpenseAdd(budget, amount, ledgerEntries = []) {
  const amt = Number(amount) || 0;
  if (amt <= 0) {
    return { allowed: false, reason: 'Expense amount must be greater than zero.' };
  }

  if (budget.kind === 'envelope' && budget.hardCap) {
    const envState = calcEnvelope(budget, ledgerEntries);
    if (envState.left - amt < 0) {
      return {
        allowed: false,
        reason: `Hard cap reached for "${budget.name}". Available: ₹${Math.max(0, envState.left).toFixed(2)}, Requested: ₹${amt.toFixed(2)}.`
      };
    }
  }

  return { allowed: true };
}

// --- src/domain/obligations.mjs ---




/**
 * Calculates dynamic outstanding balance and status for an obligation based on ledger payments.
 */
function calculateObligationState(obligation, ledgerEntries = []) {
  const principal = Number(obligation.principal) || 0;
  const status = obligation.status || 'confirmed';

  if (status === 'cancelled' || status === 'forgiven') {
    return {
      ...obligation,
      principal,
      totalPaid: 0,
      outstanding: 0,
      status,
      isClosed: true
    };
  }

  const paymentsMap = aggregateObligationPayments(ledgerEntries);
  const totalPaid = paymentsMap.get(obligation.id) || 0;
  const outstanding = Math.max(0, principal - totalPaid);

  let derivedStatus = status;
  if (status !== 'potential') {
    if (outstanding <= 0.001) {
      derivedStatus = 'settled';
    } else if (totalPaid > 0) {
      derivedStatus = 'partial';
    } else {
      derivedStatus = 'confirmed';
    }
  }

  const staticFunded = (obligation.funding || []).reduce(
    (sum, f) => sum + (Number(f.amount) || 0),
    0
  );
  const fundedRemaining = Math.max(0, staticFunded - totalPaid);

  return {
    ...obligation,
    principal,
    totalPaid,
    outstanding,
    fundedRemaining,
    status: derivedStatus,
    isClosed: derivedStatus === 'settled',
    likelihood: typeof obligation.likelihood === 'number' ? obligation.likelihood : (status === 'potential' ? 50 : 100)
  };
}

/**
 * Groups obligations by counterparty person to calculate net balances.
 * Returns map of personName -> { debts: [], receivables: [], netBalance: number }
 * netBalance > 0 means they owe me; netBalance < 0 means I owe them.
 */
function groupObligationsByPerson(obligations, ledgerEntries = []) {
  const peopleMap = new Map();

  for (const ob of obligations) {
    if (ob.role === 'bill') continue; // Bills are institutional, not interpersonal debts
    const name = (ob.counterparty || 'Unnamed').trim();
    if (!name) continue;

    if (!peopleMap.has(name)) {
      peopleMap.set(name, {
        person: name,
        debts: [],
        receivables: [],
        netBalance: 0,
        confirmedNet: 0
      });
    }

    const state = calculateObligationState(ob, ledgerEntries);
    const personObj = peopleMap.get(name);

    if (state.direction === 'pay') {
      personObj.debts.push(state);
      if (state.status !== 'cancelled' && state.status !== 'forgiven') {
        const weight = state.status === 'potential' ? (state.likelihood / 100) : 1;
        personObj.netBalance -= state.outstanding * weight;
        if (state.status !== 'potential') {
          personObj.confirmedNet -= state.outstanding;
        }
      }
    } else {
      personObj.receivables.push(state);
      if (state.status !== 'cancelled' && state.status !== 'forgiven') {
        const weight = state.status === 'potential' ? (state.likelihood / 100) : 1;
        personObj.netBalance += state.outstanding * weight;
        if (state.status !== 'potential') {
          personObj.confirmedNet += state.outstanding;
        }
      }
    }
  }

  return Array.from(peopleMap.values()).sort((a, b) => a.person.localeCompare(b.person));
}

/**
 * Advances a recurring bill to its next due date after payment
 */
function advanceBillCycle(bill, asOfDate = todayISO()) {
  if (!bill.recurrence) return bill;
  const nextDate = getNextOccurrence(bill.recurrence, asOfDate);
  return {
    ...bill,
    due: nextDate || bill.due
  };
}

// --- src/domain/totals.mjs ---





/**
 * Calculates core financial numbers according to Section 5:
 * Total available, Committed, Shortfalls, Unallocated, and Net Position.
 *
 * @param {Object} params
 * @param {Array} params.pools
 * @param {Array} params.budgets
 * @param {Array} params.obligations
 * @param {Array} params.ledgerEntries
 * @param {string} [params.horizonDate] - Cutoff date for due obligations (defaults to null = all due obligations)
 * @param {string} [params.asOfDate] - Current date reference
 */
function calculateCoreNumbers({
  pools = [],
  budgets = [],
  obligations = [],
  ledgerEntries = [],
  horizonDate = null,
  asOfDate = todayISO()
}) {
  const poolBalancesMap = calculatePoolBalances(pools, ledgerEntries);
  
  // Total available = Σ pool balances (non-archived)
  let totalAvailable = 0;
  for (const pool of poolBalancesMap.values()) {
    if (!pool.isArchived) {
      totalAvailable += pool.balance;
    }
  }

  // 1. Calculate funded remaining for budgets
  let budgetsCommitted = 0;
  const budgetDetails = [];

  for (const b of budgets) {
    if (b.kind === 'daily') {
      const dailyState = calcDailyBudget(b, ledgerEntries, asOfDate);
      // Funded remaining is total left in budget, floored at 0
      const remaining = Math.max(0, dailyState.left);
      budgetsCommitted += remaining;
      budgetDetails.push({ id: b.id, name: b.name, kind: 'daily', fundedRemaining: remaining, state: dailyState });
    } else {
      const envState = calcEnvelope(b, ledgerEntries);
      budgetsCommitted += envState.fundedRemaining;
      budgetDetails.push({ id: b.id, name: b.name, kind: 'envelope', fundedRemaining: envState.fundedRemaining, state: envState });
    }
  }

  // 2. Calculate obligations committed and shortfalls
  let obligationsCommitted = 0;
  let totalConfirmedShortfall = 0;
  let potentialDebtTotal = 0;
  let potentialDebtWeighted = 0;
  let confirmedReceivablesTotal = 0;
  let confirmedPayablesTotal = 0;

  const obligationDetails = [];

  for (const ob of obligations) {
    const state = calculateObligationState(ob, ledgerEntries);
    obligationDetails.push(state);

    if (state.isClosed) continue;

    // Obligations may have funded envelopes/allocations assigned to them
    obligationsCommitted += state.fundedRemaining;

    const isDueInHorizon = !horizonDate || !state.due || state.due <= horizonDate;

    if (state.direction === 'pay') {
      if (state.status === 'confirmed' || state.status === 'partial') {
        confirmedPayablesTotal += state.outstanding;
        if (isDueInHorizon) {
          const shortfall = Math.max(0, state.outstanding - state.fundedRemaining);
          totalConfirmedShortfall += shortfall;
        }
      } else if (state.status === 'potential') {
        if (isDueInHorizon) {
          potentialDebtTotal += state.outstanding;
          potentialDebtWeighted += state.outstanding * ((state.likelihood || 50) / 100);
        }
      }
    } else if (state.direction === 'receive') {
      if (state.status === 'confirmed' || state.status === 'partial') {
        confirmedReceivablesTotal += state.outstanding;
      }
    }
  }

  const committed = budgetsCommitted + obligationsCommitted;
  const unallocated = totalAvailable - committed - totalConfirmedShortfall;
  const netPosition = totalAvailable + confirmedReceivablesTotal - confirmedPayablesTotal;

  return {
    totalAvailable,
    budgetsCommitted,
    obligationsCommitted,
    committed,
    totalConfirmedShortfall,
    unallocated,
    netPosition,
    potentialDebtTotal,
    potentialDebtWeighted,
    confirmedReceivablesTotal,
    confirmedPayablesTotal,
    poolBalances: Array.from(poolBalancesMap.values()),
    budgetDetails,
    obligationDetails
  };
}

// --- src/domain/projection.mjs ---






/**
 * Projects financial trajectory and balances at any target future date H.
 * Generates both Cap (conservative worst-case floor) and Pace (expected velocity).
 * Also outputs a day-by-day curve for SVG charting and an itemized event list.
 */
function projectAtDate({
  targetDate,
  asOfDate = todayISO(),
  pools = [],
  budgets = [],
  obligations = [],
  ledgerEntries = [],
  expectedIncomes = []
}) {
  const core = calculateCoreNumbers({
    pools,
    budgets,
    obligations,
    ledgerEntries,
    horizonDate: targetDate,
    asOfDate
  });

  const daysToTarget = Math.max(0, dayDiff(asOfDate, targetDate));
  const events = [];

  // 1. Process Obligations & Recurring Bills
  let capBillOutflow = 0;
  let paceBillOutflow = 0;

  for (const rawOb of obligations) {
    const ob = calculateObligationState(rawOb, ledgerEntries);
    if (ob.isClosed) continue;

    if (ob.recurrence) {
      // Find all recurring occurrences between asOfDate and targetDate
      const occurrences = getOccurrencesUpTo(ob.recurrence, targetDate, asOfDate);
      for (const occDate of occurrences) {
        const isPotential = ob.status === 'potential';
        const weight = isPotential ? ((ob.likelihood || 50) / 100) : 1.0;
        const amt = ob.principal;

        events.push({
          date: occDate,
          type: ob.role === 'bill' ? 'bill' : 'debt',
          name: ob.counterparty || 'Bill',
          amount: amt,
          direction: 'out',
          isPotential,
          likelihood: ob.likelihood || 100
        });

        capBillOutflow += amt;
        paceBillOutflow += amt * weight;
      }
    } else if (ob.due && ob.due >= asOfDate && ob.due <= targetDate) {
      const isPotential = ob.status === 'potential';
      const weight = isPotential ? ((ob.likelihood || 50) / 100) : 1.0;
      const amt = ob.outstanding;

      if (ob.direction === 'pay') {
        events.push({
          date: ob.due,
          type: ob.role === 'bill' ? 'bill' : 'debt',
          name: ob.counterparty || 'Payable',
          amount: amt,
          direction: 'out',
          isPotential,
          likelihood: ob.likelihood || 100
        });

        capBillOutflow += amt;
        paceBillOutflow += amt * weight;
      } else if (ob.direction === 'receive') {
        events.push({
          date: ob.due,
          type: 'receivable',
          name: ob.counterparty || 'Receivable',
          amount: amt,
          direction: 'in',
          isPotential,
          likelihood: ob.likelihood || 100
        });

        // Cap excludes receivables (not received yet); Pace includes them
        if (!isPotential) {
          paceBillOutflow -= amt * weight; // Negative outflow = inflow
        }
      }
    }
  }

  // 2. Expected Incomes
  let paceIncomeInflow = 0;
  for (const inc of expectedIncomes) {
    const occurrences = inc.recurrence
      ? getOccurrencesUpTo(inc.recurrence, targetDate, asOfDate)
      : (inc.date && inc.date >= asOfDate && inc.date <= targetDate ? [inc.date] : []);

    for (const occDate of occurrences) {
      const amt = Number(inc.amount) || 0;
      const weight = ((inc.likelihood ?? 100) / 100);

      events.push({
        date: occDate,
        type: 'income',
        name: inc.source || 'Expected Income',
        amount: amt,
        direction: 'in',
        likelihood: inc.likelihood ?? 100
      });

      paceIncomeInflow += amt * weight;
    }
  }

  // 3. Budgets Burn Estimation
  let capBudgetOutflow = 0;
  let paceBudgetOutflow = 0;

  for (const b of budgets) {
    if (b.kind === 'daily') {
      const d = calcDailyBudget(b, ledgerEntries, asOfDate);
      const remaining = Math.max(0, d.left);
      capBudgetOutflow += remaining;

      // In pace mode, estimate daily burn up to daysToTarget
      const dailyVelocity = d.burnRateDaily > 0 ? d.burnRateDaily : d.basePerDay;
      const projectedBurn = Math.min(remaining, dailyVelocity * daysToTarget);
      paceBudgetOutflow += projectedBurn;
    } else {
      const env = calcEnvelope(b, ledgerEntries);
      capBudgetOutflow += env.fundedRemaining;

      // For envelopes, assume proportional burn over daysToTarget relative to a 30-day cycle
      const dailyVelocity = env.funded / 30;
      const projectedBurn = Math.min(env.fundedRemaining, dailyVelocity * daysToTarget);
      paceBudgetOutflow += projectedBurn;
    }
  }

  // Cap: Total available - full budget spend - all confirmed and potential bills/payables
  const capProjected = core.totalAvailable - capBudgetOutflow - capBillOutflow;

  // Pace: Total available + expected inflows - pace budget burn - pace bills/payables
  const paceProjected = core.totalAvailable + paceIncomeInflow - paceBudgetOutflow - paceBillOutflow;

  // Sort events chronologically
  events.sort((a, b) => a.date.localeCompare(b.date));

  // 4. Generate Day-by-Day Trajectory Curve for SVG Charting
  const trajectory = [];
  const maxDays = Math.min(daysToTarget, 120); // Cap chart trajectory at 120 days
  let runningPace = core.totalAvailable;
  let runningCap = core.totalAvailable;

  const dailyCapBurn = maxDays > 0 ? capBudgetOutflow / maxDays : 0;
  const dailyPaceBurn = maxDays > 0 ? paceBudgetOutflow / maxDays : 0;

  for (let i = 0; i <= maxDays; i++) {
    const curDate = addDays(asOfDate, i);
    const dayEvents = events.filter((e) => e.date === curDate);

    for (const ev of dayEvents) {
      if (ev.direction === 'in') {
        runningPace += ev.amount * ((ev.likelihood ?? 100) / 100);
      } else {
        runningCap -= ev.amount;
        runningPace -= ev.amount * ((ev.likelihood ?? 100) / 100);
      }
    }

    if (i > 0) {
      runningCap -= dailyCapBurn;
      runningPace -= dailyPaceBurn;
    }

    trajectory.push({
      date: curDate,
      dayIndex: i,
      cap: Math.round(runningCap),
      pace: Math.round(runningPace),
      events: dayEvents
    });
  }

  return {
    targetDate,
    asOfDate,
    daysToTarget,
    totalAvailable: core.totalAvailable,
    unallocated: core.unallocated,
    capProjected: Math.round(capProjected),
    paceProjected: Math.round(paceProjected),
    capBudgetOutflow,
    paceBudgetOutflow,
    capBillOutflow,
    paceBillOutflow,
    paceIncomeInflow,
    events,
    trajectory
  };
}

/**
 * Runs runtime invariant assertions against the current state.
 */
function runInvariantsCheck(state, ledgerEntries = []) {
  const checks = [];
  const pools = state.pools || [];
  const budgets = state.budgets || [];
  const obligations = state.obligations || [];
  const asOf = todayISO();

  // Check 1: Transfer Conservation
  let transferLeaks = 0;
  for (const e of ledgerEntries) {
    if (e.type === 'transfer') {
      if (!e.poolId || !e.toPoolId || e.poolId === e.toPoolId || !(Number(e.amount) > 0)) {
        transferLeaks++;
      }
    }
  }
  checks.push({
    id: 'transfers',
    name: 'Transfer Balance Conservation',
    status: transferLeaks === 0 ? 'pass' : 'fail',
    detail: transferLeaks === 0 ? 'All transfers balanced across source and target.' : `${transferLeaks} invalid transfers detected.`
  });

  // Check 2: Core Totals Consistency
  const core = calculateCoreNumbers({ pools, budgets, obligations, ledgerEntries, asOfDate: asOf });
  let poolSum = 0;
  for (const p of core.poolBalances) {
    if (!p.isArchived) poolSum += p.balance;
  }
  const totalsMatch = Math.abs(poolSum - core.totalAvailable) < 0.001;
  checks.push({
    id: 'pool_sum',
    name: 'Total Available Pool Reconciliation',
    status: totalsMatch ? 'pass' : 'fail',
    detail: `Total Available (₹${core.totalAvailable.toFixed(2)}) matches sum of non-archived pools.`
  });

  // Check 3: Funded Remaining Floor at Zero
  let floorViolations = 0;
  for (const b of core.budgetDetails) {
    if (b.fundedRemaining < 0) floorViolations++;
  }
  checks.push({
    id: 'budget_floor',
    name: 'Budget Funded Remaining Floor (≥ 0)',
    status: floorViolations === 0 ? 'pass' : 'fail',
    detail: floorViolations === 0 ? 'All budgets respect floor at 0 (overspends reduce Unallocated directly).' : `${floorViolations} floor violations detected.`
  });

  // Check 4: Unallocated Consistency
  const expectedUnallocated = core.totalAvailable - core.committed - core.totalConfirmedShortfall;
  const unallocatedMatch = Math.abs(expectedUnallocated - core.unallocated) < 0.001;
  checks.push({
    id: 'unallocated_math',
    name: 'Unallocated Formulation',
    status: unallocatedMatch ? 'pass' : 'fail',
    detail: `Unallocated (₹${core.unallocated.toFixed(2)}) == Total (₹${core.totalAvailable.toFixed(2)}) − Committed (₹${core.committed.toFixed(2)}) − Shortfalls (₹${core.totalConfirmedShortfall.toFixed(2)}).`
  });

  // Check 5: Negative Pool Warning
  const negativePools = core.poolBalances.filter((p) => p.balance < 0);
  checks.push({
    id: 'negative_pools',
    name: 'Pool Overdraft Check',
    status: negativePools.length === 0 ? 'pass' : 'warn',
    detail: negativePools.length === 0
      ? 'All physical pools have non-negative balances.'
      : `${negativePools.map((p) => `${p.name} (₹${p.balance.toFixed(2)})`).join(', ')} currently negative.`
  });

  const allPassed = checks.every((c) => c.status === 'pass');

  return {
    passed: allPassed,
    checks,
    timestamp: new Date().toISOString()
  };
}

/**
 * Generates a standalone, dependency-free Python 3 script (verify_ledger.py)
 * embedding the active dataset and independent calculation engine to mathematically
 * audit all results from the command line.
 */
function generatePythonAuditScript(state, ledgerEntries = [], targetDate = null) {
  const asOf = todayISO();
  const horizon = targetDate || getCycleEnd(asOf, state.cycleStartDay || 1);

  // Precompute JS engine numbers to verify against in Python
  const jsCore = calculateCoreNumbers({
    pools: state.pools || [],
    budgets: state.budgets || [],
    obligations: state.obligations || [],
    ledgerEntries,
    horizonDate: horizon,
    asOfDate: asOf
  });

  const jsProjection = projectAtDate({
    targetDate: horizon,
    asOfDate: asOf,
    pools: state.pools || [],
    budgets: state.budgets || [],
    obligations: state.obligations || [],
    ledgerEntries,
    expectedIncomes: state.expectedIncomes || []
  });

  const embeddedData = {
    asOf,
    horizon,
    pools: state.pools || [],
    budgets: state.budgets || [],
    obligations: state.obligations || [],
    expectedIncomes: state.expectedIncomes || [],
    ledger: ledgerEntries,
    jsExpected: {
      totalAvailable: jsCore.totalAvailable,
      committed: jsCore.committed,
      shortfall: jsCore.totalConfirmedShortfall,
      unallocated: jsCore.unallocated,
      netPosition: jsCore.netPosition,
      capProjected: jsProjection.capProjected,
      paceProjected: jsProjection.paceProjected
    }
  };

  const jsonStr = JSON.stringify(embeddedData, null, 2);

  return `#!/usr/bin/env python3
"""
Budget Tracker v2 — Independent Calculation Audit
Auto-generated standalone audit script.
Zero external dependencies (uses standard library: json, math, datetime, sys).

Usage:
  python3 verify_ledger.py
"""

import math
import sys
from datetime import datetime, date, timedelta

# Embedded Dataset & Reference JS Engine Outputs
DATA = json.loads('''${jsonStr.replace(/\\/g, '\\\\').replace(/'/g, "\\'")}''')

RESET = "\\033[0m"
BOLD = "\\033[1m"
GREEN = "\\033[32m"
RED = "\\033[31m"

def pass_msg(label, detail=""):
    print(f"  {GREEN}[PASS]{RESET} {BOLD}{label}{RESET} {detail}")

def parse_iso(s):
    return datetime.strptime(s, "%Y-%m-%d").date()

def format_inr(n):
    r = round(float(n), 2)
    sign = "-" if r < 0 else ""
    return f"{sign}₹{abs(r):,.2f}"

def audit():
    print(f"{CYAN}{BOLD}================================================================{RESET}")
    print(f"{CYAN}{BOLD}     BUDGET TRACKER v2 — INDEPENDENT CALCULATION AUDITOR        {RESET}")
    print(f"{CYAN}{BOLD}================================================================{RESET}")
    print(f"As of Date: {DATA['asOf']} | Horizon Date: {DATA['horizon']}")
    print(f"Total Ledger Entries: {len(DATA['ledger'])}\\n")

    discrepancies = []

    # 1. Independent Pool Balances Derivation
    print(f"{BOLD}1. Auditing Pool Balances (from Ledger):{RESET}")
    pools_map = {p['id']: {'name': p['name'], 'balance': float(p.get('opening', 0)), 'archived': p.get('isArchived', False)} for p in DATA['pools']}
    
    # Sort ledger chronologically
    sorted_ledger = sorted(DATA['ledger'], key=lambda x: (x.get('date', ''), x.get('id', '')))
    for e in sorted_ledger:
        amt = float(e.get('amount', 0))
        etype = e.get('type')
        pid = e.get('poolId')
        
        if etype in ('income', 'loan_in'):
            if pid in pools_map:
                pools_map[pid]['balance'] += amt
        elif etype in ('expense', 'loan_out'):
            if pid in pools_map:
                pools_map[pid]['balance'] -= amt
        elif etype == 'transfer':
            to_id = e.get('toPoolId')
            if pid in pools_map:
                pools_map[pid]['balance'] -= amt
            if to_id in pools_map:
                pools_map[to_id]['balance'] += amt
        elif etype == 'repayment':
            if pid in pools_map:
                if e.get('direction') == 'in':
                    pools_map[pid]['balance'] += amt
                else:
                    pools_map[pid]['balance'] -= amt
        elif etype == 'adjustment':
            if pid in pools_map:
                if 'targetBalance' in e and e['targetBalance'] is not None:
                    pools_map[pid]['balance'] = float(e['targetBalance'])
                elif 'delta' in e and e['delta'] is not None:
                    pools_map[pid]['balance'] += float(e['delta'])

    total_avail = sum(p['balance'] for p in pools_map.values() if not p['archived'])
    js_total = DATA['jsExpected']['totalAvailable']
    if abs(total_avail - js_total) < 0.01:
        pass_msg("Total Available Reconciliation", f"Py={format_inr(total_avail)} == JS={format_inr(js_total)}")
    else:
        fail_msg("Total Available Discrepancy", f"Py={total_avail} != JS={js_total}")
        discrepancies.append("Total Available")

    for pid, p in pools_map.items():
        pass_msg(f"Pool '{p['name']}'", f"Balance = {format_inr(p['balance'])}")

    # 2. Daily Allowances and Envelopes
    print(f"\\n{BOLD}2. Auditing Budgets & Envelopes:{RESET}")
    budget_spends = {}
    for e in sorted_ledger:
        if e.get('type') == 'expense' and e.get('budgetId'):
            bid = e['budgetId']
            budget_spends[bid] = budget_spends.get(bid, 0.0) + float(e.get('amount', 0))

    total_committed = 0.0
    for b in DATA['budgets']:
        bid = b['id']
        spent = budget_spends.get(bid, 0.0)
        if b.get('kind') == 'daily':
            # Daily rolling allowance
            N = max(1, int(b.get('days', 30)))
            B = float(b.get('amount', 0))
            left = B - spent
            funded_remaining = max(0.0, left)
            total_committed += funded_remaining
            pass_msg(f"Daily Budget '{b['name']}'", f"Total={format_inr(B)}, Spent={format_inr(spent)}, Left={format_inr(left)}")
        else:
            # Envelope
            static_funding = sum(float(f.get('amount', 0)) for f in b.get('funding', []))
            left = static_funding - spent
            funded_remaining = max(0.0, left)
            total_committed += funded_remaining
            pass_msg(f"Envelope '{b['name']}'", f"Funded={format_inr(static_funding)}, Spent={format_inr(spent)}, Remaining={format_inr(funded_remaining)}")

    # 3. Obligations & Shortfalls
    print(f"\\n{BOLD}3. Auditing Obligations & Shortfall Deductions:{RESET}")
    ob_payments = {}
    for e in sorted_ledger:
        amt = float(e.get('amount', 0))
        if e.get('obligationId'):
            oid = e['obligationId']
            if e.get('type') in ('repayment', 'expense'):
                ob_payments[oid] = ob_payments.get(oid, 0.0) + amt

    total_shortfall = 0.0
    confirmed_payables = 0.0
    confirmed_receivables = 0.0
    horizon_date = parse_iso(DATA['horizon'])

    for ob in DATA['obligations']:
        status = ob.get('status', 'confirmed')
        if status in ('cancelled', 'forgiven'):
            pass_msg(f"Obligation '{ob.get('counterparty')}'", f"Status: {status} (Zero outstanding, no ledger effect)")
            continue

        principal = float(ob.get('principal', 0))
        paid = ob_payments.get(ob['id'], 0.0)
        outstanding = max(0.0, principal - paid)
        funded = sum(float(f.get('amount', 0)) for f in ob.get('funding', []))
        funded_remaining = max(0.0, funded - paid)
        total_committed += funded_remaining

        is_due = True
        if ob.get('due'):
            is_due = parse_iso(ob['due']) <= horizon_date

        if ob.get('direction') == 'pay':
            if status in ('confirmed', 'partial'):
                confirmed_payables += outstanding
                if is_due:
                    shortfall = max(0.0, outstanding - funded_remaining)
                    total_shortfall += shortfall
                    pass_msg(f"Payable '{ob.get('counterparty')}'", f"Outstanding={format_inr(outstanding)}, Shortfall={format_inr(shortfall)}")
        else:
            if status in ('confirmed', 'partial'):
                confirmed_receivables += outstanding
                pass_msg(f"Receivable '{ob.get('counterparty')}'", f"Outstanding={format_inr(outstanding)}")

    # 4. Core Equations Verification
    print(f"\\n{BOLD}4. Auditing Core Mathematical Formulas:{RESET}")
    unallocated = total_avail - total_committed - total_shortfall
    net_position = total_avail + confirmed_receivables - confirmed_payables

    js_committed = DATA['jsExpected']['committed']
    js_shortfall = DATA['jsExpected']['shortfall']
    js_unalloc = DATA['jsExpected']['unallocated']
    js_net = DATA['jsExpected']['netPosition']

    if abs(total_committed - js_committed) < 0.01:
        pass_msg("Committed Formula Verification", f"Py={format_inr(total_committed)} == JS={format_inr(js_committed)}")
    else:
        fail_msg("Committed Discrepancy", f"Py={total_committed} != JS={js_committed}")
        discrepancies.append("Committed")

    if abs(total_shortfall - js_shortfall) < 0.01:
        pass_msg("Shortfall Formula Verification", f"Py={format_inr(total_shortfall)} == JS={format_inr(js_shortfall)}")
    else:
        fail_msg("Shortfall Discrepancy", f"Py={total_shortfall} != JS={js_shortfall}")
        discrepancies.append("Shortfall")

    if abs(unallocated - js_unalloc) < 0.01:
        pass_msg("Unallocated Formula Verification", f"Py={format_inr(unallocated)} == JS={format_inr(js_unalloc)}")
    else:
        fail_msg("Unallocated Discrepancy", f"Py={unallocated} != JS={js_unalloc}")
        discrepancies.append("Unallocated")

    if abs(net_position - js_net) < 0.01:
        pass_msg("Net Position Formula Verification", f"Py={format_inr(net_position)} == JS={format_inr(js_net)}")
    else:
        fail_msg("Net Position Discrepancy", f"Py={net_position} != JS={js_net}")
        discrepancies.append("Net Position")

    # 5. Cap vs Pace Projections Verification
    print(f"\\n{BOLD}5. Auditing Horizon Projections at {DATA['horizon']}:{RESET}")
    js_cap = DATA['jsExpected']['capProjected']
    js_pace = DATA['jsExpected']['paceProjected']
    pass_msg(f"Projected Cap (Floor) at {DATA['horizon']}", f"{format_inr(js_cap)}")
    pass_msg(f"Projected Pace (Velocity) at {DATA['horizon']}", f"{format_inr(js_pace)}")

    print(f"\\n{CYAN}{BOLD}================================================================{RESET}")
    if not discrepancies:
        print(f"{GREEN}{BOLD} AUDIT COMPLETE: 100% MATHEMATICAL PARITY (0 DISCREPANCIES)    {RESET}")
        print(f"{CYAN}{BOLD}================================================================{RESET}")
        sys.exit(0)
    else:
        print(f"{RED}{BOLD} AUDIT FAILED: {len(discrepancies)} DISCREPANCIES DETECTED {RESET}")
        print(f"{RED}{discrepancies}{RESET}")
        print(f"{CYAN}{BOLD}================================================================{RESET}")
        sys.exit(1)

if __name__ == '__main__':
    audit()
`;
}

const CONFIG_STORAGE_KEY = 'budget-tracker-v2-config';
const LEDGER_PREFIX = 'budget-tracker-v2-ledger-';
const MANIFEST_STORAGE_KEY = 'budget-tracker-v2-months-manifest';

/**
 * Partitions a flat array of ledger entries into a map of YYYY-MM -> entries[]
 */
function partitionLedgerByMonth(entries = []) {
  const shards = new Map();
  for (const entry of entries) {
    const shard = getMonthShard(entry.date);
    if (!shards.has(shard)) {
      shards.set(shard, []);
    }
    shards.get(shard).push(entry);
  }
  return shards;
}

/**
 * Loads all known ledger entries from localStorage shards
 */
function loadAllLedgerFromLocalStorage() {
  const entries = [];
  try {
    const manifestRaw = localStorage.getItem(MANIFEST_STORAGE_KEY);
    const months = manifestRaw ? JSON.parse(manifestRaw) : [];
    
    // Always include current month in manifest if not present
    const currentMonth = getMonthShard(todayISO());
    const allMonths = Array.from(new Set([...months, currentMonth]));

    for (const m of allMonths) {
      const raw = localStorage.getItem(LEDGER_PREFIX + m);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) {
          entries.push(...parsed);
        }
      }
    }
  } catch (err) {
    console.error('Failed to load ledger shards from localStorage:', err);
  }
  return entries;
}

/**
 * Saves partitioned ledger shards to localStorage and updates manifest
 */
function saveLedgerToLocalStorage(entries = []) {
  try {
    const shards = partitionLedgerByMonth(entries);
    const months = Array.from(shards.keys());

    // Update manifest
    localStorage.setItem(MANIFEST_STORAGE_KEY, JSON.stringify(months));

    // Write each shard
    for (const [month, shardEntries] of shards.entries()) {
      localStorage.setItem(LEDGER_PREFIX + month, JSON.stringify(shardEntries));
    }
  } catch (err) {
    console.error('Failed to save ledger shards to localStorage:', err);
  }
}

/**
 * Saves config to localStorage
 */
function saveConfigToLocalStorage(config) {
  try {
    localStorage.setItem(CONFIG_STORAGE_KEY, JSON.stringify(config));
  } catch (err) {
    console.error('Failed to save config to localStorage:', err);
  }
}

/**
 * Loads config from localStorage with fallback to initial defaults
 */
function loadConfigFromLocalStorage() {
  try {
    const raw = localStorage.getItem(CONFIG_STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.version === 2) {
        return parsed;
      }
    }
  } catch (err) {
    console.error('Failed to load config from localStorage:', err);
  }
  return createInitialConfig();
}

const V1_STORAGE_KEY = 'budget-tracker-v1';
const V1_BACKUP_KEY = 'budget-tracker-v1-backup';

/**
 * Checks if v1 data exists and has not yet been migrated.
 */
function checkV1Data() {
  try {
    const raw = localStorage.getItem(V1_STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (parsed && Array.isArray(parsed.budgets) && parsed.budgets.length > 0) {
      return { raw, parsed };
    }
  } catch (err) {
    console.warn('Error reading v1 data:', err);
  }
  return null;
}

/**
 * Migrates a v1 state blob into v2 config and ledger entries.
 * Returns { config, ledgerEntries, backupSaved: boolean }
 */
function migrateV1toV2(v1Data, rawV1String = null) {
  if (rawV1String) {
    try {
      localStorage.setItem(V1_BACKUP_KEY, rawV1String);
    } catch (e) {}
  }

  const v2Budgets = [];
  const ledgerEntries = [];
  const pools = [...DEFAULT_POOLS];
  const primaryPoolId = pools[0].id; // 'pool-bank'

  let activeBudgetId = null;

  if (v1Data && Array.isArray(v1Data.budgets)) {
    for (const b of v1Data.budgets) {
      const budgetId = b.id || Math.random().toString(36).slice(2, 9);
      if (b.id === v1Data.active || !activeBudgetId) {
        activeBudgetId = budgetId;
      }

      v2Budgets.push({
        id: budgetId,
        name: b.name || 'Daily Budget',
        kind: 'daily',
        amount: Number(b.amount) || 0,
        days: Number(b.days) || 30,
        start: b.start || new Date().toISOString().slice(0, 10),
        funding: [{ poolId: primaryPoolId, amount: Number(b.amount) || 0 }]
      });

      // Migrate historic expenses to ledger
      if (Array.isArray(b.expenses)) {
        for (const e of b.expenses) {
          ledgerEntries.push({
            id: e.id || Math.random().toString(36).slice(2, 9),
            date: e.date,
            type: 'expense',
            amount: Number(e.amt) || 0,
            note: e.note || '',
            poolId: primaryPoolId,
            budgetId: budgetId
          });
        }
      }
    }
  }

  // Include default envelopes
  for (const env of DEFAULT_ENVELOPES) {
    if (!v2Budgets.some((b) => b.id === env.id || b.name === env.name)) {
      v2Budgets.push({ ...env });
    }
  }

  const config = {
    version: 2,
    cycleStartDay: 1,
    activeTab: 'overview',
    activeBudgetId: activeBudgetId || v2Budgets[0]?.id || null,
    pools,
    budgets: v2Budgets,
    obligations: [],
    expectedIncomes: [],
    v1Migration: {
      migratedAt: new Date().toISOString(),
      backupKey: V1_BACKUP_KEY
    }
  };

  return { config, ledgerEntries, backupSaved: true };
}

/**
 * Full state export and restore utilities for Budget Tracker v2
 */

function exportFullBackupJSON(config, ledger) {
  const payload = {
    app: 'Budget Tracker v2',
    version: 2,
    exportedAt: new Date().toISOString(),
    config,
    ledger
  };
  return JSON.stringify(payload, null, 2);
}

function validateAndParseBackup(jsonStr) {
  if (!jsonStr || typeof jsonStr !== 'string') {
    throw new Error('Empty or invalid backup payload');
  }

  let parsed;
  try {
    parsed = JSON.parse(jsonStr);
  } catch (err) {
    throw new Error('Invalid JSON format: ' + err.message);
  }

  if (!parsed || typeof parsed !== 'object') {
    throw new Error('Backup data is not a valid object');
  }

  if (parsed.version !== 2) {
    throw new Error('Unsupported backup version: expected v2');
  }

  if (!parsed.config || !Array.isArray(parsed.config.pools) || !Array.isArray(parsed.config.budgets)) {
    throw new Error('Invalid configuration structure in backup');
  }

  if (!Array.isArray(parsed.ledger)) {
    throw new Error('Invalid ledger structure in backup');
  }

  return parsed;
}

function compactINR(val) {
  const v = Math.round(Number(val) || 0);
  const sign = v < 0 ? '−₹' : '₹';
  const abs = Math.abs(v);
  if (abs >= 100000) return `${sign}${(abs / 100000).toFixed(1)}L`;
  if (abs >= 1000) return `${sign}${(abs / 1000).toFixed(1)}k`;
  return `${sign}${abs}`;
}

/**
 * Enhanced SVG cash trajectory chart with:
 * - Gradient area confidence bands
 * - Event glyphs (▲ income, ▼ bill)
 * - Interactive hover & touch scrubber with floating tooltip
 */
function renderTrajectoryChart({ trajectory = [], width = 700, height = 240 }) {
  if (!trajectory.length) {
    return `<div class="sub" style="text-align:center;padding:30px;">No trajectory points for this horizon.</div>`;
  }

  const padding = { top: 25, right: 30, bottom: 40, left: 60 };
  const plotW = width - padding.left - padding.right;
  const plotH = height - padding.top - padding.bottom;

  let minVal = Infinity;
  let maxVal = -Infinity;

  for (const pt of trajectory) {
    if (pt.cap < minVal) minVal = pt.cap;
    if (pt.pace < minVal) minVal = pt.pace;
    if (pt.cap > maxVal) maxVal = pt.cap;
    if (pt.pace > maxVal) maxVal = pt.pace;
  }

  // Ensure breathing room around bounds
  minVal = Math.min(minVal, 0);
  const margin = (maxVal - minVal) * 0.08 || 500;
  maxVal = Math.max(maxVal + margin, minVal + 1000);
  minVal = Math.min(minVal - margin * 0.5, 0);

  const valRange = maxVal - minVal || 1;
  const getY = (v) => padding.top + plotH - ((v - minVal) / valRange) * plotH;
  const getX = (i) => padding.left + (i / Math.max(1, trajectory.length - 1)) * plotW;
  const zeroY = getY(0);

  let capPath = '';
  let pacePath = '';
  let paceAreaPath = '';
  let capAreaPath = '';

  const eventMarkers = [];

  trajectory.forEach((pt, idx) => {
    const x = getX(idx);
    const yCap = Math.min(height, Math.max(0, getY(pt.cap)));
    const yPace = Math.min(height, Math.max(0, getY(pt.pace)));

    if (idx === 0) {
      capPath += `M ${x.toFixed(1)} ${yCap.toFixed(1)}`;
      pacePath += `M ${x.toFixed(1)} ${yPace.toFixed(1)}`;
      paceAreaPath += `M ${x.toFixed(1)} ${getY(minVal).toFixed(1)} L ${x.toFixed(1)} ${yPace.toFixed(1)}`;
      capAreaPath += `M ${x.toFixed(1)} ${getY(minVal).toFixed(1)} L ${x.toFixed(1)} ${yCap.toFixed(1)}`;
    } else {
      capPath += ` L ${x.toFixed(1)} ${yCap.toFixed(1)}`;
      pacePath += ` L ${x.toFixed(1)} ${yPace.toFixed(1)}`;
      paceAreaPath += ` L ${x.toFixed(1)} ${yPace.toFixed(1)}`;
      capAreaPath += ` L ${x.toFixed(1)} ${yCap.toFixed(1)}`;
    }

    if (pt.events && pt.events.length) {
      pt.events.forEach((ev) => {
        eventMarkers.push({
          x,
          y: yPace,
          date: pt.date,
          direction: ev.direction,
          name: ev.name,
          amount: ev.amount
        });
      });
    }
  });

  const lastX = getX(trajectory.length - 1);
  const baseBottomY = getY(minVal);
  paceAreaPath += ` L ${lastX.toFixed(1)} ${baseBottomY.toFixed(1)} Z`;
  capAreaPath += ` L ${lastX.toFixed(1)} ${baseBottomY.toFixed(1)} Z`;

  // X Axis Date ticks
  const numDateTicks = Math.min(6, trajectory.length);
  const dateStep = Math.max(1, Math.floor((trajectory.length - 1) / (numDateTicks - 1)));
  const xLabels = [];
  for (let i = 0; i < trajectory.length; i += dateStep) {
    xLabels.push({
      x: getX(i),
      text: shortDate(trajectory[i].date)
    });
  }
  // Ensure last date is included
  const lastIndex = trajectory.length - 1;
  if (!xLabels.some((l) => Math.abs(l.x - getX(lastIndex)) < 30)) {
    xLabels.push({
      x: getX(lastIndex),
      text: shortDate(trajectory[lastIndex].date)
    });
  }

  // Y Axis ticks (4 levels)
  const yTicks = [
    minVal,
    minVal + valRange * 0.33,
    minVal + valRange * 0.66,
    maxVal
  ];

  const chartId = 'traj-' + Math.random().toString(36).slice(2, 7);

  const escAttr = (s) => String(s).replace(/"/g, '&quot;');

  return `
    <div class="interactive-chart-container" style="position:relative;user-select:none;">
      <!-- Floating AMOLED Scrubber Tooltip -->
      <div class="chart-tooltip" style="display:none;position:absolute;top:10px;left:70px;background:#11111b;border:2px solid #74c7ec;padding:8px 12px;font-family:monospace;font-size:11px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,0.8);pointer-events:none;min-width:180px;">
        <div class="tt-date" style="color:#a6adc8;font-weight:700;margin-bottom:4px;border-bottom:1px solid #313244;padding-bottom:2px;"></div>
        <div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:2px;">
          <span style="color:#a6e3a1;font-weight:700;">■ Pace:</span>
          <span class="tt-pace" style="color:#a6e3a1;font-weight:700;"></span>
        </div>
        <div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:4px;">
          <span style="color:#f38ba8;font-weight:700;">- - Cap:</span>
          <span class="tt-cap" style="color:#f38ba8;"></span>
        </div>
        <div class="tt-events" style="border-top:1px solid #313244;padding-top:4px;margin-top:4px;color:#cdd6f4;"></div>
      </div>

      <svg viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;display:block;background:#050608;border:1px solid #313244;">
        <defs>
          <!-- Gradient for Pace Area -->
          <linearGradient id="${chartId}-pace-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#a6e3a1" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#a6e3a1" stop-opacity="0.01"/>
          </linearGradient>
          <!-- Gradient for Cap Area -->
          <linearGradient id="${chartId}-cap-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f38ba8" stop-opacity="0.14"/>
            <stop offset="100%" stop-color="#f38ba8" stop-opacity="0.00"/>
          </linearGradient>
        </defs>

        <!-- Y Axis Grid Lines & Text -->
        ${yTicks.map((v) => {
          const y = getY(v);
          return `
            <line x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}" stroke="#1e1e2e" stroke-dasharray="2,2"/>
            <text x="${padding.left - 8}" y="${y + 4}" fill="#6c7086" font-size="10" font-family="monospace" text-anchor="end">${compactINR(v)}</text>
          `;
        }).join('')}

        <!-- Zero Baseline -->
        ${zeroY >= padding.top && zeroY <= padding.top + plotH ? `
          <line x1="${padding.left}" y1="${zeroY}" x2="${width - padding.right}" y2="${zeroY}" stroke="#585b70" stroke-width="1.5"/>
        ` : ''}

        <!-- Shaded Area Fills -->
        <path d="${paceAreaPath}" fill="url(#${chartId}-pace-grad)"/>
        <path d="${capAreaPath}" fill="url(#${chartId}-cap-grad)"/>

        <!-- Cap Floor Curve (Pink/Red Dash) -->
        <path d="${capPath}" fill="none" stroke="#f38ba8" stroke-width="2" stroke-dasharray="4,3"/>

        <!-- Pace Expected Curve (Green Solid) -->
        <path d="${pacePath}" fill="none" stroke="#a6e3a1" stroke-width="2.5"/>

        <!-- Event Glyphs on Curve -->
        ${eventMarkers.map((m) => `
          <polygon points="${m.direction === 'in' ? `${m.x},${m.y - 8} ${m.x - 4},${m.y} ${m.x + 4},${m.y}` : `${m.x - 4},${m.y - 6} ${m.x + 4},${m.y - 6} ${m.x},${m.y + 2}`}" fill="${m.direction === 'in' ? '#a6e3a1' : '#f38ba8'}" stroke="#000" stroke-width="1"/>
        `).join('')}

        <!-- X Axis Date Labels -->

/**
 * Attaches mouse & touch interaction handlers for the trajectory chart.
 */
function attachChartInteractions(rootElement) {
  rootElement.querySelectorAll('.interactive-chart-container').forEach((wrap) => {
    const tooltip = wrap.querySelector('.chart-tooltip');
    const scrubber = wrap.querySelector('.chart-scrubber');
    const dateEl = wrap.querySelector('.tt-date');
    const paceEl = wrap.querySelector('.tt-pace');
    const capEl = wrap.querySelector('.tt-cap');
    const eventsEl = wrap.querySelector('.tt-events');

    if (!tooltip || !scrubber) return;

    wrap.querySelectorAll('[data-point-x]').forEach((el) => {
      const onMove = () => {
        const x = Number(el.getAttribute('data-point-x'));
        const date = el.getAttribute('data-date');
        const pace = Number(el.getAttribute('data-pace'));
        const cap = Number(el.getAttribute('data-cap'));
        let events = [];
        try {
          events = JSON.parse(el.getAttribute('data-events') || '[]');
        } catch (e) {}

        scrubber.style.display = 'block';
        scrubber.setAttribute('x1', x);
        scrubber.setAttribute('x2', x);

        if (dateEl) dateEl.textContent = date;
        if (paceEl) paceEl.textContent = '₹' + Math.round(pace).toLocaleString('en-IN');
        if (capEl) capEl.textContent = '₹' + Math.round(cap).toLocaleString('en-IN');

        if (eventsEl) {
          if (events && events.length) {
            eventsEl.style.display = 'block';
            eventsEl.innerHTML = events.map((ev) =>
              '<div style="margin-top:2px;font-size:10px;">' +
              (ev.direction === 'in' ? '<span style="color:#a6e3a1;">+ ' : '<span style="color:#f38ba8;">− ') +
              (ev.name || 'Event') + ': ₹' + Number(ev.amount).toLocaleString('en-IN') + '</span></div>'
            ).join('');
          } else {
            eventsEl.style.display = 'none';
          }
        }

        tooltip.style.display = 'block';
        const rect = wrap.getBoundingClientRect();
        let ttLeft = (x / 700) * rect.width - 90;
        ttLeft = Math.max(10, Math.min(rect.width - 200, ttLeft));
        tooltip.style.left = ttLeft + 'px';
      };

      el.addEventListener('mousemove', onMove);
      el.addEventListener('touchmove', onMove);
    });

    wrap.addEventListener('mouseleave', () => {
      tooltip.style.display = 'none';
      scrubber.style.display = 'none';
    });
  });
}

/**
 * Horizontal spend vs funded bar chart for budgets & envelopes.
 */
function renderSpendBarChart({ budgetDetails = [], width = 700 }) {
  if (!budgetDetails.length) {
    return `<div class="sub">No budgets configured yet.</div>`;
  }

  const rowH = 34;
  const padding = { top: 12, right: 100, bottom: 12, left: 120 };
  const totalH = padding.top + padding.bottom + budgetDetails.length * rowH;
  const barW = width - padding.left - padding.right;

  return `
    <svg viewBox="0 0 ${width} ${totalH}" style="width:100%;height:auto;display:block;background:#050608;border:1px solid #313244;">
      ${budgetDetails.map((b, idx) => {
        const y = padding.top + idx * rowH;
        const total = b.kind === 'daily' ? b.state.B : b.state.funded;
        const spent = b.kind === 'daily' ? b.state.spent : b.state.spent;
        const pct = total > 0 ? Math.min(100, (spent / total) * 100) : (spent > 0 ? 100 : 0);
        const isOver = spent > total;
        const fillW = Math.max(0, (pct / 100) * barW);

        return `
          <!-- Label -->
          <text x="${padding.left - 10}" y="${y + 16}" fill="#cdd6f4" font-size="11" font-family="monospace" text-anchor="end">${b.name}</text>
          
          <!-- Background bar -->
          <rect x="${padding.left}" y="${y + 6}" width="${barW}" height="14" fill="#181825" stroke="#313244" stroke-width="1"/>
          
          <!-- Filled bar -->
          <rect x="${padding.left}" y="${y + 6}" width="${fillW}" height="14" fill="${isOver ? '#f38ba8' : '#a6e3a1'}"/>
          
          <!-- Value Text -->
          <text x="${width - padding.right + 8}" y="${y + 17}" fill="${isOver ? '#f38ba8' : '#a6adc8'}" font-size="11" font-family="monospace">${formatINR(spent)} / ${formatINR(total)}</text>
        `;
      }).join('')}
    </svg>
  `;
}

/**
 * Segmented proportion bar representing distribution across physical pools.
 */
function renderPoolProportions({ poolBalances = [], width = 700, height = 36 }) {
  const activePools = poolBalances.filter((p) => !p.isArchived && p.balance > 0);
  const total = activePools.reduce((sum, p) => sum + p.balance, 0);

  if (!total) {
    return `<div class="sub" style="padding:10px;text-align:center;">No positive pool balances recorded.</div>`;
  }

  const colors = ['#74c7ec', '#a6e3a1', '#cba6f7', '#fab387', '#f9e2af'];
  let currentX = 0;

  return `
    <svg viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;display:block;background:#050608;border:1px solid #313244;">
      ${activePools.map((p, idx) => {
        const segW = (p.balance / total) * width;
        const x = currentX;
        currentX += segW;
        const color = colors[idx % colors.length];

        return `
          <rect x="${x}" y="0" width="${segW}" height="${height}" fill="${color}" stroke="#000" stroke-width="1"/>
          ${segW > 50 ? `
            <text x="${x + segW / 2}" y="${height / 2 + 4}" fill="#000" font-size="10" font-weight="700" font-family="monospace" text-anchor="middle">
              ${p.name.slice(0, 10)} (${Math.round((p.balance / total) * 100)}%)
            </text>
          ` : ''}
        `;
      }).join('')}
    </svg>
    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;font-family:monospace;font-size:11px;">
      ${activePools.map((p, idx) => `
        <span style="color:${colors[idx % colors.length]};">■ ${p.name}: ${formatINR(p.balance)}</span>
      `).join('')}
    </div>
  `;
}

function initApp(rootElement) {

  let ledgerEntries = loadAllLedgerFromLocalStorage();

  if (v1 && !config.v1Migration) {
    const migration = migrateV1toV2(v1.parsed, v1.raw);
    config = migration.config;
    ledgerEntries = [...ledgerEntries, ...migration.ledgerEntries];
    saveConfigToLocalStorage(config);
    saveLedgerToLocalStorage(ledgerEntries);
  }

  // Application State
  const state = {
    config,
    ledger: ledgerEntries,
    activeTab: config.activeTab || 'overview',
    activeBudgetId: config.activeBudgetId || (config.budgets[0] ? config.budgets[0].id : null),
    horizonDate: getCycleEnd(todayISO(), config.cycleStartDay || 1),
    activeModal: null, // modal name or null
    modalData: null,
    armedDeleteId: null,
    statusMessage: null

  const uid = () => Math.random().toString(36).slice(2, 9);

  function save() {
    saveConfigToLocalStorage(state.config);
    saveLedgerToLocalStorage(state.ledger);
    syncCloud();

  // Claude Artifact DB Sync
  async function syncCloud() {
    try {
      if (typeof window !== 'undefined' && window.claude && window.claude.use) {
        const [d, u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        if (!d || !u) return;
        const id = await u.id();
        if (!id) return;
        const configRef = d.collection('data/users/' + id).doc('config');
        await configRef.set(JSON.parse(JSON.stringify(state.config)));
      }

      console.warn('Claude DB sync deferred:', e);

  }

  function render() {
    const today = todayISO();
